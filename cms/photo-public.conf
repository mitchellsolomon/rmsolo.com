server {
    listen 80;
    server_name _;

    location = /_health {
        return 204;
    }

    location = /api/photographs {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://strapi:1337;
        proxy_set_header Host strapi.rmsolohome.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /uploads/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://strapi:1337;
        proxy_set_header Host strapi.rmsolohome.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
